<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барабаны</title>
    <meta name="description" content="Сбор на барабаны и другие инструменты.">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}"/>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="site-title">Барабаны</h1>
            <nav class="navigation" aria-label="Основная навигация">
                <a class="nav-button {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">Главная</a>
                <a class="nav-button {% if '/parts/' in request.path %}active{% endif %}" href="{% url 'parts' %}">Участники</a>
                <a class="nav-button {% if '/history/' in request.path %}active{% endif %}" href="{% url 'history' %}">История</a>
                <a class="nav-button {% if '/account/' in request.path %}active{% endif %}" href="{% url 'account' %}">Как пополнить</a>
            </nav>
        </header>
        <main class="main-content">
            <section class="content-block">
                <h2>На что собираем</h2>
                <img src="{% static 'img/on_music.jpg' %}" alt="предмет сбора">
                <h2>Состояние счета</h2>
                <img src="{% static 'img/moby.jpg' %}" alt="состояние счета">
                <img src="{{ statement.image.url }}" alt="">
            </section>
            <section class="content-block">
                <h2>Последние пополнения</h2>
                <div class="table-container">
                    <table class="custom-table">
                        <!-- Шапка таблицы -->
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Количество</th>
                            </tr>
                        </thead>
                        <!-- Основное содержимое -->
                        <tbody>
                            <tr>
                                <td>Stage Master 500</td>
                                <td>45 000 BYN</td>
                            </tr>
                            <tr>
                                <td>Jazz Essence</td>
                                <td>38 000 BYN</td>
                            </tr>
                            <tr>
                                <td>Rock Monster</td>
                                <td>52 000 BYN</td>
                            </tr>
                            <tr>
                                <td>Studio Pro</td>
                                <td>60 000 BYN</td>
                            </tr>
                        </tbody>
                        <!-- Подвал таблицы (например, для итогов) -->
                        <tfoot>
                            <tr>
                                <td >Всего собрано</td>
                                <td>456 BYN</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>&copy; by Alexei Giro</p>
        </footer>
    </div>
    <script src="{% static 'js/home.js' %}?v=1.2"></script>
</body>
</html>
